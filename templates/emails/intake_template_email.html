<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      /* Deliberately unstyled beyond a measure cap: font family, size, and
         color are the email client's own defaults, so the message reads
         like ordinary correspondence. premailer inlines this at send time
         (utils.mail.render_inlined). */
      .letter {
        max-width: 40em;
      }
    </style>
  </head>
  <body>
    <div class="letter">{{ body|linebreaksbr }}</div>
  </body>
</html>
