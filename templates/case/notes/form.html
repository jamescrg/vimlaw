<div class="modal-dialog modal-md">
  <div class="modal-content">
    <div class="modal-header">
      <h1 class="modal-title">{{ action }} Note</h1>
      <div>
        <button type="button" @click="$dispatch('close-modal')">
          <i class="icon-x"></i>
        </button>
      </div>
    </div>
    <div class="modal-body">
      <form id="note-form"
            hx-post="{% url 'case:notes-edit' note.id %}"
            hx-target="#htmx-modal-container"
            class="form-compact col2">
        {% csrf_token %}
        {{ form }}
      </form>
    </div>
    <div class="modal-footer">
      <button type="button"
              class="btn btn-danger"
              hx-confirm="Are you sure you want to delete this note?"
              hx-post="{% url 'notes:delete' note.id %}"
              hx-target="#htmx-modal-container">Delete</button>
      <button type="submit" form="note-form" class="btn btn-success">Submit</button>
    </div>
  </div>
</div>
