{% comment %}
Add-note modal for a matter (matter select + category + title). add_qs
round-trips ?folder= / ?context=editor from the tree menu into the POST so
the note lands in the chosen folder.
{% endcomment %}
<div class="modal-dialog modal-md">
  <div class="modal-content">
    <div class="modal-header">
      <h1 class="modal-title">{{ action }} Note</h1>
      <div>
        <button type="button" @click="$dispatch('close-modal')">
          <i class="icon-x"></i>
        </button>
      </div>
    </div>
    <div class="modal-body">
      <form id="note-form"
            hx-post="{% url 'case:notes-add' matter.id %}{% if add_qs %}?{{ add_qs }}{% endif %}"
            hx-target="#htmx-modal-container"
            class="form-compact col2">
        {% csrf_token %}
        {{ form }}
      </form>
    </div>
    <div class="modal-footer">
      <button type="button"
              class="btn btn-secondary"
              @click="$dispatch('close-modal')">Cancel</button>
      <button type="submit" form="note-form" class="btn btn-success">Submit</button>
    </div>
  </div>
</div>
