{% load cache_buster %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" content="" />
    <title>Drafting - Error</title>
    <meta name="viewport" content="width = device-width, initial-scale = 1" />
    <link rel="stylesheet" href="{% static_v 'css/palette.css' %}" />
    <link rel="stylesheet" href="{% static_v 'css/colors.css' %}" />
    <link rel="stylesheet" href="{% static_v 'css/typeography.css' %}" />
    <script>
    (function () {
      var setting = localStorage.getItem('theme') || 'auto';
      var resolved = setting === 'auto'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : setting;
      document.documentElement.setAttribute('data-theme', resolved);
    })();
    </script>
  </head>
  <body>
    <div class="draft-window-error">
      <h1>Could not open the drafting session</h1>
      <p>{{ error }}</p>
      <p>Close this tab and try again from the {{ matter.name }} Drafts tab.</p>
    </div>
  </body>
</html>
