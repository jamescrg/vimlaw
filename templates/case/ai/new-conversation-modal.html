<div class="modal-dialog modal-md">
  <div class="modal-content">
    <div class="modal-header">
      <h1 class="modal-title">New Conversation</h1>
      <div>
        <button type="button" @click="$dispatch('close-modal')">
          <i class="icon-x"></i>
        </button>
      </div>
    </div>
    <div class="modal-body">
      <form id="new-conversation-form"
            class="form-compact"
            onsubmit="return aiLaunchNewConversation(event);">
        <div class="form-group">
          <label for="new-conversation-kind">Mode</label>
          <select id="new-conversation-kind">
            <option value="classic">Classic</option>
            <option value="agent">Agentic</option>
          </select>
        </div>
        <div class="form-group">
          <label for="new-conversation-llm">Model</label>
          <select id="new-conversation-llm">
            {% for key, label in llm_choices %}
              <option value="{{ key }}"
                      {% if key == "claude-fable" %}data-agent-only="true"{% endif %}
                      {% if key == llm %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="new-conversation-title">Name</label>
          <input type="text"
                 id="new-conversation-title"
                 class="form-control"
                 required
                 autofocus>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button"
              class="btn btn-secondary"
              @click="$dispatch('close-modal')">Cancel</button>
      <button type="submit" form="new-conversation-form" class="btn btn-success">Submit</button>
    </div>
  </div>
</div>
<script>
  (function () {
    // Fable is offered for agentic conversations only; the server enforces
    // the same rule (views._llm_for_kind), this just keeps the picker honest.
    const kindSelect = document.getElementById('new-conversation-kind');
    const modelSelect = document.getElementById('new-conversation-llm');
    function syncAgentOnlyModels() {
      const agentic = kindSelect.value === 'agent';
      let switched = false;
      modelSelect.querySelectorAll('option[data-agent-only]').forEach(function (opt) {
        opt.disabled = !agentic;
        if (!agentic && opt.selected) { opt.selected = false; switched = true; }
      });
      if (switched) modelSelect.value = 'claude-opus-5';
    }
    kindSelect.addEventListener('change', syncAgentOnlyModels);
    syncAgentOnlyModels();
  })();
  window.aiLaunchNewConversation = function(event) {
    event.preventDefault();
    const input = document.getElementById('new-conversation-title');
    const title = input.value.trim();
    if (!title) {
      input.focus();
      return false;
    }
    const baseUrl = '{% url "case:ai-new-conversation-view" matter.id %}';
    const llm = document.getElementById('new-conversation-llm').value;
    const kind = document.getElementById('new-conversation-kind').value;
    const url = `${baseUrl}?llm=${encodeURIComponent(llm)}&kind=${encodeURIComponent(kind)}&title=${encodeURIComponent(title)}`;
    window.open(url, '_blank');
    window.dispatchEvent(new CustomEvent('close-modal'));
    return false;
  };
</script>
