<div class="modal-dialog modal-md">
  <div class="modal-content">
    <div class="modal-header">
      <h1 class="modal-title">New Conversation</h1>
      <div>
        <button type="button" @click="$dispatch('close-modal')">
          <i class="icon-x"></i>
        </button>
      </div>
    </div>
    <div class="modal-body">
      <form id="new-conversation-form"
            class="form-compact"
            onsubmit="return aiLaunchNewConversation(event);">
        <div class="form-group">
          <label for="new-conversation-llm">Model</label>
          <select id="new-conversation-llm">
            {% for key, label in llm_choices %}
              <option value="{{ key }}" {% if key == llm %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Mode</label>
          <div class="ai-kind-options">
            <label class="ai-kind-option">
              <input type="radio"
                     name="kind"
                     value="classic"
                     {% if default_kind != "agent" %}checked{% endif %}>
              <span class="ai-kind-name">Classic</span>
              <span class="detail-text">Gathers the case file up front and answers in one pass.</span>
            </label>
            <label class="ai-kind-option">
              <input type="radio"
                     name="kind"
                     value="agent"
                     {% if default_kind == "agent" %}checked{% endif %}>
              <span class="ai-kind-name">Agentic</span>
              <span class="detail-text">Reads matter materials as it works and narrates each step. Slower, better on large matters.</span>
            </label>
          </div>
        </div>
        <div class="form-group">
          <label for="new-conversation-title">Name</label>
          <input type="text"
                 id="new-conversation-title"
                 class="form-control"
                 required
                 autofocus>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button"
              class="btn btn-secondary"
              @click="$dispatch('close-modal')">Cancel</button>
      <button type="submit" form="new-conversation-form" class="btn btn-success">Submit</button>
    </div>
  </div>
</div>
<script>
  window.aiLaunchNewConversation = function(event) {
    event.preventDefault();
    const input = document.getElementById('new-conversation-title');
    const title = input.value.trim();
    if (!title) {
      input.focus();
      return false;
    }
    const baseUrl = '{% url "case:ai-new-conversation-view" matter.id %}';
    const llm = document.getElementById('new-conversation-llm').value;
    const kindInput = document.querySelector('#new-conversation-form input[name="kind"]:checked');
    const kind = kindInput ? kindInput.value : 'classic';
    const url = `${baseUrl}?llm=${encodeURIComponent(llm)}&kind=${encodeURIComponent(kind)}&title=${encodeURIComponent(title)}`;
    window.open(url, '_blank');
    window.dispatchEvent(new CustomEvent('close-modal'));
    return false;
  };
</script>
