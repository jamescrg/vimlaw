<div class="modal-dialog modal-md">
  <div class="modal-content">
    <div class="modal-header">
      <h1 class="modal-title">New Conversation</h1>
      <div>
        <button type="button" @click="$dispatch('close-modal')">
          <i class="icon-x"></i>
        </button>
      </div>
    </div>
    <div class="modal-body">
      <form id="new-conversation-form"
            class="form-compact"
            onsubmit="return aiLaunchNewConversation(event);">
        <div class="form-group">
          <label for="new-conversation-title">Name</label>
          <input type="text"
                 id="new-conversation-title"
                 class="form-control"
                 required
                 autofocus>
        </div>
        <div class="form-group">
          <label>Chat style</label>
          <div class="ai-kind-options">
            <label class="ai-kind-option">
              <input type="radio"
                     name="kind"
                     value="classic"
                     {% if default_kind != "research" %}checked{% endif %}
                     onchange="document.getElementById('research-depth-group').classList.add('hide')">
              <span class="ai-kind-name">Analytic:</span>
              <span class="detail-text">Answers from the case file and the model's knowledge.</span>
            </label>
            <label class="ai-kind-option">
              <input type="radio"
                     name="kind"
                     value="research"
                     {% if default_kind == "research" %}checked{% endif %}
                     onchange="document.getElementById('research-depth-group').classList.remove('hide')">
              <span class="ai-kind-name">Synthetic:</span>
              <span class="detail-text">Actively searches CourtListener, reads opinions, and cites only what it retrieved.</span>
            </label>
          </div>
        </div>
        <div class="form-group {% if default_kind != 'research' %}hide{% endif %}"
             id="research-depth-group">
          <label for="new-conversation-depth">Search depth</label>
          <select id="new-conversation-depth">
            <option value="quick">Quick</option>
            <option value="standard" selected>Standard</option>
            <option value="deep">Deep</option>
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button"
              class="btn btn-secondary"
              @click="$dispatch('close-modal')">Cancel</button>
      <button type="submit" form="new-conversation-form" class="btn btn-success">Submit</button>
    </div>
  </div>
</div>
<script>
  window.aiLaunchNewConversation = function(event) {
    event.preventDefault();
    const input = document.getElementById('new-conversation-title');
    const title = input.value.trim();
    if (!title) {
      input.focus();
      return false;
    }
    const baseUrl = '{% url "case:ai-new-conversation-view" matter.id %}';
    const llm = '{{ llm }}';
    const kind = document.querySelector('input[name="kind"]:checked').value;
    const depth = document.getElementById('new-conversation-depth').value;
    const url = `${baseUrl}?llm=${encodeURIComponent(llm)}&title=${encodeURIComponent(title)}&kind=${encodeURIComponent(kind)}&depth=${encodeURIComponent(depth)}`;
    window.open(url, '_blank');
    window.dispatchEvent(new CustomEvent('close-modal'));
    return false;
  };
</script>
