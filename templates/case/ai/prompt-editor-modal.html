{% load static %}
{% load cache_buster %}
<div class="modal-dialog modal-xl prompt-editor-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h1 class="modal-title">Compose Prompt</h1>
      <div>
        <button type="button" @click="$dispatch('close-modal')">
          <i class="icon-x"></i>
        </button>
      </div>
    </div>
    <div class="modal-body">
      {% comment %}
      Same anatomy as the note editor's toolbar band: save sits left of the
      format cluster behind a divider, and the whole band centers over the
      editor column.
      {% endcomment %}
      <div class="prompt-editor-toolbar">
        <a href="#" id="save-status-btn" title="Saved" onclick="return false;">
          <i class="icon-save"></i>
        </a>
        <span class="toolbar-divider"></span>
        <div class="format-toolbar">{% include "components/format-toolbar.html" %}</div>
      </div>
      <div id="promptEditorContainer" class="prompt-editor-content"></div>
      <form id="promptEditorForm"
            hx-post="{% url 'case:ai-send' matter.id %}"
            hx-target="#messageContainer"
            hx-swap="innerHTML">
        <input type="hidden" name="conversation_id" value="{{ conversation_id }}">
        <input type="hidden" name="llm" value="{{ llm }}">
        <input type="hidden" name="title" value="{{ title }}">
        <input type="hidden" name="message" id="promptEditorMessage">
      </form>
    </div>
    <div class="modal-footer prompt-editor-footer">
      <div class="modal-footer-left">
        <button type="button"
                class="btn btn-secondary"
                @click="$dispatch('close-modal')">Cancel</button>
        <button type="button" class="btn btn-secondary" id="promptEditorClear">Clear</button>
      </div>
      <button type="button" class="btn btn-success" id="promptEditorSubmit">Send to AI</button>
    </div>
  </div>
</div>
<script type="module">
  import { initPromptEditor, getMarkdownContent, destroyPromptEditor, hasContent, getHtmlContent, setHtmlContent, clearContent } from '{% static_v "js/prompt-editor.js" %}';
  import { handleEditorShortcut } from '{% static_v "js/editor-shortcuts.js" %}';

  // Use conversation_id if available, otherwise use 'new-{matter_id}' for new conversations
  const convId = '{{ conversation_id }}' || 'new-{{ matter.id }}';
  const DRAFT_KEY = 'ai-prompt-draft-' + convId;
  const container = document.getElementById('promptEditorContainer');
  const editor = initPromptEditor(container);

  // Focus editor after modal animation completes
  setTimeout(() => {
    editor.commands.focus();
  }, 100);

  // Check for initial text passed from textarea
  const initialText = window._promptEditorInitialText || '';
  delete window._promptEditorInitialText;

  // Restore draft if available, or use initial text
  const savedDraft = localStorage.getItem(DRAFT_KEY);
  if (savedDraft) {
    setHtmlContent(savedDraft);
  } else if (initialText) {
    // Convert plain text to HTML: blank lines separate paragraphs, single
    // newlines become soft line breaks (<br>) within a paragraph. Wrapping every
    // line in its own <p> previously added a paragraph margin to each soft break,
    // showing up as extra space between lines in the rich editor.
    const escapeHtml = (s) => s
      .replace(/&/g, '&amp;')
      .replace(/</g , '&lt;') .replace( />/g, '&gt;');
    const html = initialText
      .replace(/\r\n?/g, '\n')
      .split(/\n{2,}/)
      .map((block) => {
        const inner = block.split('\n').map(escapeHtml).join('<br>');
        return '<p>' + (inner || '<br>') + '</p>';
      })
      .join('');
    setHtmlContent(html);
  }

  // Save status management
  let saveTimer = null;
  function updateSaveStatus(status) {
    const btn = document.getElementById('save-status-btn');
    if (!btn) return;
    const icon = btn.querySelector('i');
    if (!icon) return;

    // Same disk glyph either way — the .active urgent tint signals unsaved
    icon.className = 'icon-save';
    if (status === 'unsaved') {
      btn.classList.add('active');
      btn.title = 'Unsaved changes';
    } else {
      btn.classList.remove('active');
      btn.title = 'Saved';
    }
  }

  function saveDraftNow() {
    const html = getHtmlContent();
    if (html && html !== '<p></p>') {
      localStorage.setItem(DRAFT_KEY, html);
    } else {
      localStorage.removeItem(DRAFT_KEY);
    }
    updateSaveStatus('saved');
  }

  // Auto-save draft on content changes
  editor.on('update', () => {
    updateSaveStatus('unsaved');
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDraftNow, 500);
  });

  // The notes editor's shortcut map (headings, lists, highlights, Ctrl+S
  // flushes the draft). Bound on the modal root, so the listener leaves
  // with the modal and never fires behind it.
  document.querySelector('.prompt-editor-modal').addEventListener('keydown', (e) => {
    handleEditorShortcut(editor, e, {
      save: () => {
        if (saveTimer) clearTimeout(saveTimer);
        saveDraftNow();
      },
    });
  });

  document.getElementById('promptEditorSubmit').addEventListener('click', function() {
    if (!hasContent()) {
      return;
    }
    const markdown = getMarkdownContent();
    document.getElementById('promptEditorMessage').value = markdown;
    // Clear draft on successful submit
    localStorage.removeItem(DRAFT_KEY);
    document.getElementById('promptEditorForm').requestSubmit();
  });

  // Close modal after form submission completes
  document.getElementById('promptEditorForm').addEventListener('htmx:afterRequest', function(event) {
    // Sync newly-created conversation id back to the parent page so a
    // follow-up prompt targets the same conversation instead of creating a new one.
    const xhr = event.detail.xhr;
    if (xhr) {
      const newConvId = xhr.getResponseHeader('X-Conversation-Id');
      if (newConvId) {
        const convIdInput = document.getElementById('conversationId');
        if (convIdInput) {
          convIdInput.value = newConvId;
        }
        window.history.replaceState({}, '', '/case/ai/conversations/' + newConvId + '/view/');
      }
    }
    window.dispatchEvent(new CustomEvent('close-modal'));
    updatePromptList();
    scrollMessagesToBottom();
  });

  // Clear button handler
  document.getElementById('promptEditorClear').addEventListener('click', async function() {
    const confirmed = await showConfirm({
      title: 'Clear Editor',
      message: 'Are you sure you want to clear the editor?',
      confirmText: 'Clear',
      isDangerous: true
    });
    if (confirmed) {
      clearContent();
      localStorage.removeItem(DRAFT_KEY);
      updateSaveStatus('saved');
    }
  });

  // Clean up editor when modal closes (but keep draft)
  window.addEventListener('close-modal', function handler() {
    destroyPromptEditor();
    window.removeEventListener('close-modal', handler);
  }, { once: true });
</script>
