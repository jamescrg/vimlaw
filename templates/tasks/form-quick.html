<input type="text"
       class="tasks-add-quick-input"
       placeholder="{% if quick_add_ai %}Describe a task in plain language{% else %}Matter - Description{% endif %}"
       name="description"
       hx-post="{% url 'tasks:add-quick' %}"
       hx-trigger="keyup[keyCode==13]"
       hx-disabled-elt="this"
       hx-on::after-request="if (event.detail.successful) this.value = ''">
