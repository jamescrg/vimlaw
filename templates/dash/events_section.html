{% if upcoming_events %}
  <div class="dash-row">
    <div class="events-header">
      <h2>Upcoming Events</h2>
      <a href="{% url 'calendar:index' %}" class="btn-ghost"><i class="icon-arrow-up-right"></i></a>
    </div>
    <div class="event-cards-grid">
      {% for event in upcoming_events %}
        {% include "calendar/event-card.html" with show_matter=True %}
      {% endfor %}
    </div>
  </div>
{% endif %}
