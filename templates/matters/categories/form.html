<div class="modal-dialog modal-md">
  <div class="modal-content">
    <div class="modal-header">
      <h1 class="modal-title">
        {% if edit %}
          Edit Category
        {% else %}
          Add Category
        {% endif %}
      </h1>
      <div>
        <button type="button" @click="$dispatch('close-modal')">
          <i class="icon-x"></i>
        </button>
      </div>
    </div>
    <div class="modal-body">
      <form id="category-form"
            hx-post="{% if edit %}{% url 'matters:categories-edit' category.id %}{% else %}{% url 'matters:categories-add' matter.id %}{% endif %}"
            hx-target="#htmx-modal-container"
            role="form"
            class="form-compact col2">
        {% csrf_token %}
        {{ form }}
      </form>
    </div>
    <div class="modal-footer">
      {% if edit %}
        <button type="button"
                class="btn btn-danger"
                hx-confirm="Delete this category? Entries coded to it become uncategorized."
                hx-delete="{% url 'matters:categories-delete' category.id %}"
                hx-target="#htmx-modal-container">Delete</button>
      {% else %}
        <button type="button"
                class="btn btn-secondary"
                @click="$dispatch('close-modal')">Cancel</button>
      {% endif %}
      <button type="submit" form="category-form" class="btn btn-success">Submit</button>
    </div>
  </div>
</div>
