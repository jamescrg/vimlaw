{# Shared toolbar for the matter Events tab's list and calendar views — the main calendar's toolbar minus the matter dropdown (the matter is implicit). #}
<div class="toolbar mobile-min-toolbar">
  <div class="toolbar-left">
    <div class="filter-tools">
      <button hx-get="/events/add/{{ matter.id }}/matters"
              hx-target="#htmx-modal-container">
        <i class="icon-plus"></i>
      </button>
      <div class="view-toggle">
        <button type="button"
                class="{% if view_mode == 'list' %}toggle-active{% endif %}"
                hx-post="{% url 'matters:events-view-mode' id=matter.id mode='list' %}"
                hx-swap="none"
                title="List View">
          <i class="icon-list"></i>
        </button>
        <button type="button"
                class="{% if view_mode == 'calendar' %}toggle-active{% endif %}"
                hx-post="{% url 'matters:events-view-mode' id=matter.id mode='calendar' %}"
                hx-swap="none"
                title="Calendar View">
          <i class="icon-calendar"></i>
        </button>
      </div>
      <button type="button"
              hx-get="{% url 'calendar:filter' %}"
              hx-target="#htmx-modal-container">
        <i class="icon-list-filter with-text"></i>Filter
      </button>
      {% include "matters/events/status-dropdown.html" %}
    </div>
  </div>
  <div class="toolbar-right">
    <a href="#"
       hx-get="{% url 'calendar:deadline-modal' %}"
       hx-target="#htmx-modal-container">
      <i class="icon-calendar with-text"></i>Deadline Calculator
    </a>
  </div>
</div>
