<div class="toolbar">
  <div class="toolbar-left">
    <h2>Intake Emails</h2>
    <div class="filter-tools">
      <button type="button"
              hx-get="{% url 'settings:add-intake-email' %}"
              hx-target="#htmx-modal-container"
              hx-trigger="click">
        <i class="icon-plus"></i>
      </button>
    </div>
  </div>
</div>
<div class="table-container">
  <table class="table settings-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Subject</th>
      </tr>
    </thead>
    <tbody>
      {% for template in email_templates %}
        <tr>
          <td class="dropdown-cell">
            <div class="dropdown" x-data="dropdown()">
              <button class="button-link"
                      type="button"
                      x-ref="button"
                      @click="toggle()"
                      :aria-expanded="open">{{ template.name }}</button>
              <ul class="dropdown-menu" x-ref="menu" x-show="open">
                <li>
                  <a class="dropdown-item"
                     hx-get="{% url 'settings:edit-intake-email' template.id %}"
                     hx-target="#htmx-modal-container"
                     hx-trigger="click"><i class="icon-pencil"></i> Edit</a>
                </li>
                <li>
                  <a class="dropdown-item"
                     hx-post="{% url 'settings:delete-intake-email' template.id %}"
                     hx-confirm="Delete this email template?"><i class="icon-trash-2"></i> Delete</a>
                </li>
              </ul>
            </div>
          </td>
          <td>{{ template.subject }}</td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="2" class="empty-message">No email templates yet.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
