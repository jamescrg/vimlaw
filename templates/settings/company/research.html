<h2>Research</h2>
<hr />
<p class="detail-text">Defaults for legal research (e.g. jurisdiction).</p>
<form hx-post="{% url 'settings:company-research' %}"
      hx-target="#company-research"
      role="form"
      class="form-responsive form-spacious">
  {% csrf_token %}
  {{ research_form }}
  <br />
  <div class="flex-center-space">
    <div>
      <button type="submit" class="btn btn-success">Save</button>
    </div>
  </div>
</form>
