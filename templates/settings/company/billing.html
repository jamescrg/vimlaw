<h2>Billing</h2>
<hr />
<p class="detail-text">
  Appearance of the client-facing payment page and the payment emails. Both
  fonts are Noto.
</p>
<form hx-post="{% url 'settings:company-billing' %}"
      hx-target="#company-billing"
      role="form"
      class="form-responsive form-spacious payment-branding-form">
  {% csrf_token %}
  {{ billing_form }}
  <br />
  <div class="flex-center-space">
    <div>
      <button type="submit" class="btn btn-success">Save</button>
    </div>
  </div>
</form>
