<div class="modal-dialog modal-md">
  <div class="modal-content">
    <div class="modal-header">
      <h1 class="modal-title">Add a Form</h1>
      <div>
        <button type="button" @click="$dispatch('close-modal')">
          <i class="icon-x"></i>
        </button>
      </div>
    </div>
    <div class="modal-body">
      {% comment %}
        One select, full width, no label or caption — the modal's own title
        says everything a label would. The field is rendered by hand because
        {{ form }} would bring the label back.
      {% endcomment %}
      <form id="add-form"
            hx-post="{{ action }}"
            hx-target="#htmx-modal-container"
            role="form"
            class="form-compact">
        {% csrf_token %}
        {{ form.template }}
        {{ form.template.errors }}
      </form>
    </div>
    <div class="modal-footer">
      <button type="button"
              class="btn btn-secondary"
              @click="$dispatch('close-modal')">Cancel</button>
      <button type="submit" form="add-form" class="btn btn-success">Add Form</button>
    </div>
  </div>
</div>
