{% comment %}
One note row of the editor trees (expects `n`; `note` is the open note).
Shared by the general Files tree and the per-matter trees; the htmx URLs
branch on the note's matter. data-matter-id ("" for general) is the
drag-and-drop scope guard.
{% endcomment %}
<li class="file-tree-item file-tree-note{% if n.id == note.id %} active{% endif %}"
    draggable="true"
    data-note-id="{{ n.id }}"
    data-matter-id="{{ n.matter_id|default_if_none:'' }}"
    data-move-url="{% url 'notes:note-move' n.id %}"
    data-delete-url="{% url 'notes:delete' n.id %}"
    {% if n.matter_id %}data-properties-url="{% url 'notes:note-properties' n.id %}"{% endif %}
    hx-get="{% url 'notes:note-content-partial' n.id %}"
    hx-target="#note-editor-container"
    hx-swap="innerHTML"
    hx-push-url="{% url 'notes:note-view' n.id %}">
  <span class="file-tree-toggle-spacer"></span>
  <span class="file-tree-name">{{ n.title }}</span>
</li>
